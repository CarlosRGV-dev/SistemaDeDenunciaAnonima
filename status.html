<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Status - PMESP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="header-logo-container">
                <img src="img/escudo-pmsp.png" alt="Logo PMESP" class="pmesp-logo">
                <div class="header-text">
                    <span class="header-pmesp">PMESP</span>
                    <span class="header-seguranca">SEGURANÇA E CIDADANIA</span>
                </div>
            </div>
            <div class="header-title">SISTEMA DE DENÚNCIAS ANÔNIMAS - PMESP</div>
        </div>
        <nav class="main-nav">
            <a href="index.html">INÍCIO</a>
            <a href="denuncia.html" class="active">FAZER DENÚNCIA</a>
            <a href="status.html" id="acompanhar-status-link">ACOMPANHAR STATUS</a>
            <a href="blog.html">BLOG</a>
            <a href="contato.html">CONTACT</a>
        </nav>
    </header>

    <main class="main-container">
        <h1>Consultar Minha Denúncia</h1>
        <div class="status-search-container">
            <input type="text" id="input-busca-protocolo" placeholder="Ex: PROT2026-9999">
            <button onclick="consultarStatusGeral()" class="submit-btn">BUSCAR</button>
        </div>
        
        <div id="status-resultado-final" class="hidden status-card">
            <h3>Protocolo: <span id="span-protocolo"></span></h3>
            <div class="timeline">
                <p><strong>Status Atual:</strong> <span id="txt-status">Em Análise</span></p>
                <div class="progress-bar"><div class="progress-fill" style="width: 50%;"></div></div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
